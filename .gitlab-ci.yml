default:
  image: node:24.17.0-bookworm
  interruptible: true
  tags:
    - test
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

stages:
  - verify
  - deploy

quality:
  stage: verify
  script:
    - pnpm run typecheck
    - pnpm exec vitest run
    - pnpm run lint
    - pnpm run check:circular-deps
    - pnpm run check:unused
    - pnpm run build:prod

deploy_pages:
  stage: deploy
  needs:
    - quality
  script:
    - pnpm run build:prod
    - pnpm dlx wrangler@4 pages deploy dist --project-name=antd-admin-template --branch="$CI_COMMIT_REF_NAME"
  environment:
    name: production
    url: https://antd-admin-template.pages.dev
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
