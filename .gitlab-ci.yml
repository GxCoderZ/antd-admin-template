variables:
  PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.cache/ms-playwright

default:
  image: node:24.17.0-bookworm
  interruptible: true
  tags:
    - test
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
      - .cache/ms-playwright
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

stages:
  - verify
  - e2e
  - deploy

quality:
  stage: verify
  script:
    - pnpm run typecheck
    - pnpm test -- --run
    - pnpm run lint
    - pnpm run check:circular-deps
    - pnpm run check:unused
    - pnpm run build:prod
  artifacts:
    paths:
      - dist/
    expire_in: 7 days

e2e_chromium:
  stage: e2e
  script:
    - pnpm exec playwright install --with-deps chromium
    - pnpm run test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days

deploy_pages:
  stage: deploy
  needs:
    - job: quality
      artifacts: true
    - job: e2e_chromium
      artifacts: false
  script:
    - pnpm run build:prod
    - pnpm dlx wrangler@4 pages deploy dist --project-name=antd-admin-template --branch="$CI_COMMIT_REF_NAME"
  environment:
    name: production
    url: https://antd-admin-template.pages.dev
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
