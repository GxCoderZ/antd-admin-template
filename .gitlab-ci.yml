stages:
  - verify
  - deploy

default:
  image: node:22-bookworm-slim
  tags:
    - test
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.6.4 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

verify:
  stage: verify
  script:
    - pnpm run typecheck
    - pnpm test -- --run
    - pnpm run lint
    - pnpm run check:circular-deps
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy_pages:
  stage: deploy
  needs:
    - verify
  script:
    - pnpm run build:prod
    - pnpm dlx wrangler@4 pages deploy dist --project-name=antd-admin-template --branch="$CI_COMMIT_REF_NAME"
  environment:
    name: production
    url: https://antd-admin-template.pages.dev
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
