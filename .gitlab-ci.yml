default:
  image: node:24.17.0-bookworm
  interruptible: true
  tags:
    - test
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

stages:
  - verify
  - e2e
  - deploy

quality:
  stage: verify
  script:
    - pnpm run typecheck
    - pnpm test -- --run
    - pnpm run lint
    - pnpm run check:circular-deps
    - pnpm run check:unused
    - pnpm run build:prod
  artifacts:
    paths:
      - dist/
    expire_in: 7 days

e2e_chromium:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  script:
    - pnpm run test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    # The HTML report already contains these attachments; keep visual checks in test-results.
    exclude:
      - test-results/**/trace.zip
      - test-results/**/test-failed-*.png
      - test-results/**/error-context.md
    expire_in: 7 days

deploy_pages:
  stage: deploy
  needs:
    - job: quality
      artifacts: false
    - job: e2e_chromium
      artifacts: false
  script:
    - CF_PAGES=1 CF_PAGES_COMMIT_SHA="$CI_COMMIT_SHA" pnpm run build:prod
    - pnpm dlx wrangler@4 pages deploy dist --project-name=antd-admin-template --branch="$CI_COMMIT_REF_NAME" --commit-hash="$CI_COMMIT_SHA"
  environment:
    name: production
    url: https://antd-admin-template.pages.dev
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PUBLISH_TEMPLATE_PREVIEW == "true"'
